services:
  arcreel-asset-sync-worker:
    build:
      context: ../..
      dockerfile: deploy/asset-sync-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://api-gw:8000}
      ASSET_SYNC_POLL_SECONDS: ${ASSET_SYNC_POLL_SECONDS:-5}
    networks:
      - supabase
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
